services:
  postgres-reader-verify:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${VERIFY_READER_DB_NAME:-libnode_verify}
      POSTGRES_USER: ${VERIFY_POSTGRES_USER:-verify_user}
      POSTGRES_PASSWORD: ${VERIFY_POSTGRES_PASSWORD:-verify_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - default
      - reader-e2e

  postgres-translator-verify:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${VERIFY_TRANSLATOR_DB_NAME:-libnode_translator_verify}
      POSTGRES_USER: ${VERIFY_POSTGRES_USER:-verify_user}
      POSTGRES_PASSWORD: ${VERIFY_POSTGRES_PASSWORD:-verify_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - translator-queue-tests

  redis-verify:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - translator-queue-tests

  translator-tests:
    profiles: [translator-queue-tests]
    image: libnode-translator-queue-tests:local
    build:
      context: ../libnode-translator
      dockerfile: Dockerfile
      target: tools
    environment:
      NODE_ENV: test
      TEST_TRANSLATOR_QUEUE: "1"
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      TEST_REDIS_URL: ${TEST_REDIS_URL:-}
    depends_on:
      postgres-translator-verify:
        condition: service_healthy
      redis-verify:
        condition: service_healthy
    networks:
      - translator-queue-tests
    command: ["npm", "run", "test:queue:integration"]

  # Dedicated services: never inherit live api/web names, ports or mounts.
  reader-e2e-api-build:
    profiles: [reader-e2e]
    build:
      context: ../libnode
      target: build
    networks: [reader-e2e]

  reader-e2e-migrate:
    profiles: [reader-e2e]
    build:
      context: ../libnode
      additional_contexts:
        backend_build: service:reader-e2e-api-build
      dockerfile_inline: |
        FROM backend_build
        RUN dotnet tool restore && dotnet restore LibNode.Api.Tests/LibNode.Api.Tests.csproj
    environment:
      TEST_READER_E2E: "1"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres-reader-verify;Port=5432;Database=libnode_verify;Username=verify_user;Password=verify_password
    networks: [reader-e2e]
    command:
      - sh
      - -ec
      - |
        test "$$TEST_READER_E2E" = 1
        test "$$ConnectionStrings__DefaultConnection" = 'Host=postgres-reader-verify;Port=5432;Database=libnode_verify;Username=verify_user;Password=verify_password'
        dotnet ef database update --no-build --configuration Release

  reader-e2e-api:
    profiles: [reader-e2e]
    build:
      context: ../libnode
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres-reader-verify;Port=5432;Database=libnode_verify;Username=verify_user;Password=verify_password
      JwtSettings__Key: placeholder-reader-e2e-signing-key-not-for-production
      JwtSettings__Issuer: reader-e2e
      JwtSettings__Audience: reader-e2e
      JwtSettings__ExpiresInMinutes: "1"
      IntegrationAuth__TranslatorApiKey: placeholder-reader-e2e-ingest-key
      Cors__Origins__0: http://reader-e2e-web:3000
      AllowedHosts: reader-e2e-api
      Swagger__Enabled: "false"
      ForwardedHeaders__Enabled: "true"
      RateLimiting__Enabled: "true"
      RateLimiting__Auth__PermitLimit: "100"
      RateLimiting__Auth__WindowMinutes: "1"
      RateLimiting__Ingest__PermitLimit: "100"
      RateLimiting__Ingest__WindowMinutes: "1"
    networks: [reader-e2e]

  reader-e2e-web:
    profiles: [reader-e2e]
    build:
      context: ../libnode-frontend
      target: runtime
    environment:
      NUXT_PUBLIC_API_BASE: http://reader-e2e-api:8080
    networks: [reader-e2e]

  reader-e2e-web-checks:
    profiles: [reader-e2e]
    build:
      context: ../libnode-frontend
      target: build
    networks: [reader-e2e]
    command: ["npm", "test"]

  reader-e2e-runner:
    profiles: [reader-e2e]
    build:
      context: ../libnode-translator
      target: playwright
    environment:
      NODE_ENV: test
      TEST_READER_E2E: "1"
      TEST_READER_WEB_URL: http://reader-e2e-web:3000
      TEST_READER_API_URL: http://reader-e2e-api:8080
      TEST_READER_INGEST_KEY: placeholder-reader-e2e-ingest-key
    volumes:
      - ../libnode-frontend/tests/e2e:/app/reader-e2e:ro
    networks: [reader-e2e]
    init: true
    command: ["node", "/app/reader-e2e/run-reader-e2e.cjs"]

  api:
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-reader-verify;Port=5432;Database=${VERIFY_READER_DB_NAME:-libnode_verify};Username=${VERIFY_POSTGRES_USER:-verify_user};Password=${VERIFY_POSTGRES_PASSWORD:-verify_password}
      JwtSettings__Key: ${VERIFY_JWT_SIGNING_KEY:-placeholder-jwt-signing-key-for-verify-only}
      IntegrationAuth__TranslatorApiKey: ${VERIFY_TRANSLATOR_API_KEY:-placeholder-translator-api-key-for-verify-only}
      Cors__Origins__0: ${VERIFY_CORS_ORIGIN:-http://localhost:13001}
      AllowedHosts: api;${VERIFY_ALLOWED_HOSTS:-libnode-verify-api}
    depends_on:
      postgres-reader-verify:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  api-migrate:
    build:
      context: ../libnode
      dockerfile: Dockerfile
      target: build
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-reader-verify;Port=5432;Database=${VERIFY_READER_DB_NAME:-libnode_verify};Username=${VERIFY_POSTGRES_USER:-verify_user};Password=${VERIFY_POSTGRES_PASSWORD:-verify_password}
      JwtSettings__Key: ${VERIFY_JWT_SIGNING_KEY:-placeholder-jwt-signing-key-for-verify-only}
      IntegrationAuth__TranslatorApiKey: ${VERIFY_TRANSLATOR_API_KEY:-placeholder-translator-api-key-for-verify-only}
      Cors__Origins__0: ${VERIFY_CORS_ORIGIN:-http://localhost:13001}
    depends_on:
      postgres-reader-verify:
        condition: service_healthy
    command: ["sh", "-c", "dotnet tool restore && dotnet ef database update"]

  api-tests:
    build:
      context: ../libnode
      dockerfile: Dockerfile
      target: build
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: Host=postgres-reader-verify;Port=5432;Database=${VERIFY_READER_DB_NAME:-libnode_verify};Username=${VERIFY_POSTGRES_USER:-verify_user};Password=${VERIFY_POSTGRES_PASSWORD:-verify_password}
      JwtSettings__Key: ${VERIFY_JWT_SIGNING_KEY:-placeholder-jwt-signing-key-for-verify-only}
      IntegrationAuth__TranslatorApiKey: ${VERIFY_TRANSLATOR_API_KEY:-placeholder-translator-api-key-for-verify-only}
      Cors__Origins__0: ${VERIFY_CORS_ORIGIN:-http://localhost:13001}
      RateLimiting__Enabled: "false"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "dotnet restore LibNode.Api.Tests/LibNode.Api.Tests.csproj && dotnet test LibNode.Api.Tests/LibNode.Api.Tests.csproj --no-restore --verbosity normal"]

  web:
    environment:
      NUXT_PUBLIC_API_BASE: http://api:8080
    depends_on:
      api:
        condition: service_started

  translator-init:
    environment:
      DATABASE_URL: postgresql://${VERIFY_POSTGRES_USER:-verify_user}:${VERIFY_POSTGRES_PASSWORD:-verify_password}@postgres-translator-verify:5432/${VERIFY_TRANSLATOR_DB_NAME:-libnode_translator_verify}
      REDIS_URL: redis://redis-verify:6379
      READER_API_MOCK: "true"
      READER_API_KEY: ${VERIFY_TRANSLATOR_API_KEY:-placeholder-translator-api-key-for-verify-only}
      OPENAI_API_KEY: ${VERIFY_TRANSLATOR_OPENAI_API_KEY:-placeholder-not-used}
      BASIC_AUTH_ENABLED: "true"
      BASIC_AUTH_USERNAME: ${TRANSLATOR_BASIC_AUTH_USERNAME:-verify-translator-user}
      BASIC_AUTH_PASSWORD: ${TRANSLATOR_BASIC_AUTH_PASSWORD:-verify-translator-password-123}
      CSRF_SECRET: ${TRANSLATOR_CSRF_SECRET:-verify-csrf-secret-for-disposable-compose-only-32chars}
      OUTBOUND_ALLOW_PRIVATE_URLS: "true"
    depends_on:
      postgres-translator-verify:
        condition: service_healthy
      redis-verify:
        condition: service_healthy

  translator-web:
    environment:
      DATABASE_URL: postgresql://${VERIFY_POSTGRES_USER:-verify_user}:${VERIFY_POSTGRES_PASSWORD:-verify_password}@postgres-translator-verify:5432/${VERIFY_TRANSLATOR_DB_NAME:-libnode_translator_verify}
      REDIS_URL: redis://redis-verify:6379
      READER_API_MOCK: "true"
      READER_API_KEY: ${VERIFY_TRANSLATOR_API_KEY:-placeholder-translator-api-key-for-verify-only}
      OPENAI_API_KEY: ${VERIFY_TRANSLATOR_OPENAI_API_KEY:-placeholder-not-used}
      BASIC_AUTH_ENABLED: "true"
      BASIC_AUTH_USERNAME: ${TRANSLATOR_BASIC_AUTH_USERNAME:-verify-translator-user}
      BASIC_AUTH_PASSWORD: ${TRANSLATOR_BASIC_AUTH_PASSWORD:-verify-translator-password-123}
      CSRF_SECRET: ${TRANSLATOR_CSRF_SECRET:-verify-csrf-secret-for-disposable-compose-only-32chars}
      OUTBOUND_ALLOW_PRIVATE_URLS: "true"
    volumes:
      - translator-playwright-verify-data:/data/playwright
    depends_on:
      translator-init:
        condition: service_completed_successfully
      redis-verify:
        condition: service_healthy

  minio:
    volumes:
      - minio-verify-data:/data

  translator-worker:
    environment:
      DATABASE_URL: postgresql://${VERIFY_POSTGRES_USER:-verify_user}:${VERIFY_POSTGRES_PASSWORD:-verify_password}@postgres-translator-verify:5432/${VERIFY_TRANSLATOR_DB_NAME:-libnode_translator_verify}
      REDIS_URL: redis://redis-verify:6379
      READER_API_MOCK: "true"
      READER_API_KEY: ${VERIFY_TRANSLATOR_API_KEY:-placeholder-translator-api-key-for-verify-only}
      OPENAI_API_KEY: ${VERIFY_TRANSLATOR_OPENAI_API_KEY:-placeholder-not-used}
      BASIC_AUTH_ENABLED: "true"
      BASIC_AUTH_USERNAME: ${TRANSLATOR_BASIC_AUTH_USERNAME:-verify-translator-user}
      BASIC_AUTH_PASSWORD: ${TRANSLATOR_BASIC_AUTH_PASSWORD:-verify-translator-password-123}
      CSRF_SECRET: ${TRANSLATOR_CSRF_SECRET:-verify-csrf-secret-for-disposable-compose-only-32chars}
      OUTBOUND_ALLOW_PRIVATE_URLS: "true"
    volumes:
      - translator-playwright-verify-data:/data/playwright
    depends_on:
      translator-init:
        condition: service_completed_successfully
      redis-verify:
        condition: service_healthy

volumes:
  minio-verify-data:
  translator-playwright-verify-data:

networks:
  reader-e2e:
    internal: true
  translator-queue-tests:
    internal: true
